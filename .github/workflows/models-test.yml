name: models-test
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Models
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -w "\n[HTTP %{http_code} %{content_type}]\n" https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the single word OK"}],"max_tokens":20}'
