name: generate-post
on:
  schedule:
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: generate-post
jobs:
  generate:
    if: ${{ vars.PIPELINE_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate one post
        working-directory: my-site
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PUBLISH: 'true'
        run: node pipeline/generate.mjs --limit 1
      - name: Add cover image
        working-directory: my-site
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node pipeline/image.mjs --auto
      - name: Build check
        working-directory: my-site
        run: |
          npm ci
          npm run build
      - name: Commit and publish
        run: |
          if [ -z "$(git status --porcelain my-site/src my-site/pipeline)" ]; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-site/src/content/posts my-site/src/assets/posts my-site/pipeline/topics.json my-site/pipeline/used-images.json
          git commit -m "Pipeline run: publish generated post and update queue"
          git pull --rebase origin main
          git push origin HEAD:main
