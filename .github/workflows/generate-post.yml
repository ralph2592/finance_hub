name: generate-post
on:
  schedule:
    - cron: '30 3 * * 1,3,5'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: generate-post
jobs:
  generate:
    if: ${{ vars.PIPELINE_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate one post
        working-directory: my-site
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node pipeline/generate.mjs --limit 1
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain my-site/src/content/posts)" ]; then
            echo "No new post written, nothing to commit."
            exit 0
          fi
          BRANCH="post/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add my-site/src/content/posts my-site/pipeline/topics.json
          git commit -m "Add generated post draft"
          git push -u origin "$BRANCH"
          gh pr create --title "New post draft ($BRANCH)" \
            --body "Generated draft. Read it, fix anything wrong, set draft: false to publish, then merge."
